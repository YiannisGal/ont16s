    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  included_configs: false
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
nf_core_version: 4.2.1
repository_type: pipeline
template:
  author: IGaliatsatos
  description: Validation- and database-aware Emu profiling of ONT full-length 16S
    amplicons
  force: false
  is_nfcore: false
  name: ont16s
  org: YiannisGal
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - gpu
    - codespaces
    - seqera_platform
    - email
  version: 0.1.0
