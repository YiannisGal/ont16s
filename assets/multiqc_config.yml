report_comment: >
  This report has been generated by the <a href="https://github.com/YiannisGal/ont16s/releases/tag/0.1.0" target="_blank">YiannisGal/ont16s</a>
  analysis pipeline.
report_section_order:
  "YiannisGal-ont16s-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "YiannisGal-ont16s-summary":
    order: -1002

export_plots: true

disable_version_detection: true

custom_data:
  mock_validation:
    section_name: "Mock-community validation"
    description: "Expected taxa detected (recall) and unexpected taxa for samples with a 'mock' value. Proportions (l1_distance, bray_curtis, mean_abs_log2_ratio over taxa expected at >= 1 %; log2 ratio 1 = twice too high) are only assessed when the mock definition gives expected abundances."
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      id: "mock_validation_table"
  ont16s_warnings:
    section_name: "ont16s checks and warnings"
    description: "Emu mode decision and per-sample warnings (low depth, reads lost in filtering, unassigned reads, organelles), with the reason for each."
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      id: "ont16s_warnings_table"
  ont16s_run_summary:
    section_name: "ont16s run summary"
    description: "Per sample: reads before/after filtering, Emu mode, assigned and unassigned fractions, organelle fraction, database fit (median best-hit identity of a read subsample; read errors lower identity too)."
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      id: "ont16s_run_summary_table"
  novelty_summary:
    section_name: "Novelty (rank supported by similarity)"
    description: "Per sample: fraction of reads whose similarity to the closest database reference (corrected for the read's own sequencing errors) supports a species, genus, family ... name (Yarza et al. 2014 thresholds). frac_novel_genus = aligned reads too distant for a genus name: candidates for organisms missing from the database."
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      id: "novelty_summary_table"
sp:
  ont16s_warnings:
    fn: "ont16s_warnings.tsv"
  ont16s_run_summary:
    fn: "ont16s_run_summary.tsv"
  mock_validation:
    fn: "mock_validation_summary.tsv"
  novelty_summary:
    fn: "novelty_summary.tsv"
