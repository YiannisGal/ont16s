report_comment: >
  This report has been generated by the <a href="https://github.com/YiannisGal/ont16s/tree/dev" target="_blank">YiannisGal/ont16s</a>
  analysis pipeline.
report_section_order:
  "YiannisGal-ont16s-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "YiannisGal-ont16s-summary":
    order: -1002

export_plots: true

disable_version_detection: true

custom_data:
  mock_validation:
    section_name: "Mock-community validation"
    description: "Expected taxa detected (recall) and unexpected taxa for samples with a 'mock' value. Proportions are only assessed (l1_distance) when the mock definition gives expected abundances."
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      id: "mock_validation_table"
  ont16s_warnings:
    section_name: "ont16s checks and warnings"
    description: "Emu mode decision and per-sample warnings (low depth, reads lost in filtering, unassigned reads, organelles), with the reason for each."
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      id: "ont16s_warnings_table"
  ont16s_run_summary:
    section_name: "ont16s run summary"
    description: "Per sample: reads before/after filtering, Emu mode, assigned and unassigned fractions, organelle fraction, database fit (median best-hit identity of a read subsample; read errors lower identity too)."
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      id: "ont16s_run_summary_table"
sp:
  ont16s_warnings:
    fn: "ont16s_warnings.tsv"
  ont16s_run_summary:
    fn: "ont16s_run_summary.tsv"
  mock_validation:
    fn: "mock_validation_summary.tsv"
